<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bancada G2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e7edf2; --panel:#ffffff; --ink:#17222c; --muted:#5a6876; --line:#ccd5dd;
  --cell:#f1f5f8; --amber:#b86e00; --amber-bg:#ffe2b0; --base:#2864a8; --base-bg:#d3e4f6;
  --ok:#1b8455; --err:#b3261e; --btn:#17222c; --btn-ink:#ffffff;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111921; --panel:#1a2530; --ink:#e2e9ef; --muted:#8e9fae; --line:#2b3946;
    --cell:#212f3b; --amber:#ffb23e; --amber-bg:#4d3610; --base:#82b9f0; --base-bg:#1c3450;
    --ok:#4cc38a; --err:#ff7b72; --btn:#e2e9ef; --btn-ink:#111921;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111921; --panel:#1a2530; --ink:#e2e9ef; --muted:#8e9fae; --line:#2b3946;
  --cell:#212f3b; --amber:#ffb23e; --amber-bg:#4d3610; --base:#82b9f0; --base-bg:#1c3450;
  --ok:#4cc38a; --err:#ff7b72; --btn:#e2e9ef; --btn-ink:#111921;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45;}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel);}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line);}
.bar{max-width:760px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.bar h1{font-size:1.35rem;font-weight:700;margin:0;letter-spacing:-.01em;flex:1}
.status{display:flex;align-items:center;gap:6px;font-size:.9rem;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--ok)}
.dot.sim{background:var(--amber)}

main{max-width:760px;margin:0 auto;padding:16px 16px 40px}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:10px 14px;cursor:pointer;background:var(--btn);color:var(--btn-ink)}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--base);outline-offset:2px}

.notice{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--err);border-radius:10px;padding:12px 14px;margin-bottom:16px}
.notice[hidden]{display:none}

.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.mark{display:flex;gap:8px;margin-bottom:8px}
.mark input{flex:1;min-width:0;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.chips button{padding:6px 10px;font-weight:500;font-size:.9rem;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:999px}

.battery{color:var(--muted);font-size:.95rem;margin:0 0 14px}
.empty{color:var(--muted);padding:24px 0;text-align:center}

.type{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.type h2{font-size:1.1rem;margin:0;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.type h2 .mono{font-size:1rem}
.type .meta{color:var(--muted);font-size:.85rem;font-weight:500}
.grid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px;margin-top:12px}
.cell{background:var(--cell);border-radius:6px;padding:4px 0 5px;text-align:center;border:2px solid transparent;position:relative}
.cell .i{display:block;font-size:.62rem;color:var(--muted);line-height:1.2}
.cell .h{display:block;font-size:.95rem;font-weight:600;line-height:1.3}
.cell .d{display:block;font-size:.62rem;color:var(--muted);line-height:1.2}
.cell.noisy{opacity:.45}
.cell.diff{border-color:var(--base);background:var(--base-bg)}
.cell.flash{animation:flash 900ms ease-out}
@keyframes flash{from{background:var(--amber-bg);border-color:var(--amber)}}
@media (prefers-reduced-motion:reduce){.cell.flash{animation:none;border-color:var(--amber)}}
.hints{margin:10px 0 0;padding:0;list-style:none;font-size:.9rem;color:var(--muted)}
.hints b{color:var(--ink);font-weight:600}

.legend{font-size:.85rem;color:var(--muted);margin:0 0 16px;display:flex;flex-wrap:wrap;gap:6px 14px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px;border:2px solid transparent}
.sw.a{background:var(--amber-bg);border-color:var(--amber)}
.sw.b{background:var(--base-bg);border-color:var(--base)}
.sw.n{background:var(--cell);opacity:.45}

section.log h2{font-size:1.1rem;margin:26px 0 8px}
.logbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;max-height:340px;overflow:auto;padding:8px 10px;font-size:.78rem;line-height:1.55}
.logbox div{white-space:nowrap}
.logbox .m{color:var(--amber);font-weight:600}
.logbox .t{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--btn);color:var(--btn-ink);padding:10px 16px;border-radius:999px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>Bancada G2</h1>
    <span class="status"><span class="dot" id="dot"></span><span id="statusText">Desconectada</span></span>
    <button id="connectBtn">Conectar</button>
  </div>
</header>

<main>
  <div class="notice" id="notice" hidden></div>

  <div class="tools">
    <button class="ghost" id="baseBtn" disabled>Fixar referência</button>
    <button class="ghost" id="clearBaseBtn" hidden>Soltar referência</button>
    <button class="ghost" id="simBtn">Testar sem scooter</button>
  </div>

  <form class="mark" id="markForm">
    <input id="markInput" placeholder="O que você mudou? Ex.: luz ligada" autocomplete="off" aria-label="Descrição da marca">
    <button type="submit">Marcar</button>
  </form>
  <div class="chips" id="chips">
    <button type="button">Luz ligada</button>
    <button type="button">Luz desligada</button>
    <button type="button">Modo Eco</button>
    <button type="button">Modo Sport</button>
    <button type="button">Roda girando</button>
    <button type="button">Roda parada</button>
  </div>

  <p class="legend">
    <span><span class="sw a"></span>mudou agora</span>
    <span><span class="sw b"></span>diferente da referência</span>
    <span><span class="sw n"></span>muda sozinho (contador ou checksum)</span>
  </p>

  <p class="battery" id="battery" hidden></p>

  <div id="types"><p class="empty" id="empty">Conecte a scooter pra ver os pacotes chegando.</p></div>

  <section class="log">
    <h2>Registro</h2>
    <div class="tools">
      <button id="copyBtn">Copiar registro</button>
      <button class="ghost" id="clearBtn">Limpar</button>
    </div>
    <div class="logbox mono" id="logbox" aria-live="off"></div>
  </section>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
const SVC_UUID = '0000fff0-0000-1000-8000-00805f9b34fb', NOTIFY_UUID = '0000fff2-0000-1000-8000-00805f9b34fb';
const BAT_UUID = '0000180f-0000-1000-8000-00805f9b34fb', BATLVL_UUID = '00002a19-0000-1000-8000-00805f9b34fb';
const $ = id => document.getElementById(id);
const types = new Map();
let log = [], baseline = null, device = null, simTimer = null;

const hex = b => b.toString(16).toUpperCase().padStart(2, '0');
const hexStr = bytes => Array.from(bytes, hex).join(' ');
const ts = d => d.toTimeString().slice(0, 8) + '.' + String(d.getMilliseconds()).padStart(3, '0');
const keyOf = b => b.length >= 2 ? hex(b[0]) + ' ' + hex(b[1]) : hex(b[0] ?? 0);

function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove('show'),1800); }
function notice(msg){ const n=$('notice'); if(!msg){n.hidden=true;return;} n.textContent=msg; n.hidden=false; }
function setStatus(text, cls){ $('statusText').textContent=text; $('dot').className='dot'+(cls?' '+cls:''); }

// Decodificação por tipo de pacote (ver README): [rótulo, valor, confirmado?]
const MODES = {0x0F:'Eco', 0x14:'Sport', 0x19:'Race'};
const u16 = (b, i) => b[i] | (b[i+1]<<8);
const motorOn = (b, i) => (b[i] & 0x02) ? 'ativo' : 'parado';
const HINTS = {
  'F2 B0': b => [
    b.length>3  && ['Modo, byte 3', MODES[b[3]] || 'código ' + hex(b[3]), true],
    b.length>14 && ['Rotação, bytes 13–14', u16(b,13) + ' rpm', true],
    b.length>17 && ['Motor, bit 1 do byte 17', motorOn(b,17), true],
    b.length>9  && ['Tensão?, bytes 8–9 big-endian', (((b[8]<<8)|b[9])/100).toFixed(2) + ' V'],
    b.length>12 && ['Temperatura?, byte 12', b[12] + ' °C'],
  ],
  '27 22': b => [
    b.length>12 && ['Velocidade, byte 12', b[12] + ' km/h', true],
    b.length>5  && ['Tensão, bytes 4–5', (u16(b,4)/100).toFixed(2) + ' V', true],
    b.length>11 && ['Rotação, bytes 10–11', u16(b,10) + ' rpm', true],
    b.length>18 && ['Motor, bit 1 do byte 18', motorOn(b,18), true],
    b.length>7  && ['Corrente/potência?, bytes 6–7', String(u16(b,6))],
    b.length>16 && ['Temperatura?, byte 16', b[16] + ' °C'],
  ],
};

function onPacket(bytes){
  const now = new Date(), k = keyOf(bytes);
  let t = types.get(k);
  if(!t){ t = {key:k, count:0, prev:null, cur:null, changes:[]}; types.set(k,t); createCard(t); }
  t.prev = t.cur; t.cur = bytes; t.count++;
  if(t.prev){ for(let i=0;i<bytes.length;i++) if(t.prev[i]!==bytes[i]) t.changes[i]=(t.changes[i]||0)+1; }
  pushLog({t:now, bytes});
  renderCard(t, now);
}

function createCard(t){
  $('empty')?.remove();
  const el = document.createElement('article');
  el.className = 'type';
  el.innerHTML = `<h2><span>Tipo <span class="mono"></span></span><span class="meta"></span></h2><div class="grid mono"></div><ul class="hints"></ul>`;
  el.querySelector('h2 .mono').textContent = t.key;
  $('types').appendChild(el);
  t.el = el;
}

function renderCard(t, now){
  const b = t.cur, grid = t.el.querySelector('.grid');
  t.el.querySelector('.meta').textContent = `${t.count} pacotes, último às ${ts(now).slice(0,8)}`;
  while(grid.children.length < b.length){
    const c = document.createElement('div'); c.className='cell';
    c.innerHTML = '<span class="i"></span><span class="h"></span><span class="d"></span>';
    c.querySelector('.i').textContent = grid.children.length;
    grid.appendChild(c);
  }
  const base = baseline && baseline.get(t.key);
  for(let i=0;i<b.length;i++){
    const c = grid.children[i];
    c.querySelector('.h').textContent = hex(b[i]);
    c.querySelector('.d').textContent = b[i];
    const changed = t.prev && t.prev[i] !== b[i];
    const noisy = t.count > 6 && (t.changes[i]||0) / (t.count-1) > 0.5;
    c.classList.toggle('noisy', noisy);
    c.classList.toggle('diff', !!base && base[i] !== b[i]);
    if(changed && !noisy){ c.classList.remove('flash'); void c.offsetWidth; c.classList.add('flash'); }
  }
  const hintFn = HINTS[t.key], ul = t.el.querySelector('.hints');
  ul.innerHTML = '';
  if(hintFn) hintFn(b).filter(Boolean).forEach(([label,val,ok])=>{
    const li=document.createElement('li'); li.innerHTML='<b></b> '; li.querySelector('b').textContent=val; li.append(ok ? `(${label})` : `(${label}, palpite)`); ul.appendChild(li);
  });
}

function pushLog(entry){
  log.push(entry); if(log.length > 5000) log.shift();
  const box = $('logbox'), line = document.createElement('div');
  if(entry.mark){ line.className='m'; line.textContent = `${ts(entry.t)}  ── ${entry.mark} ──`; }
  else { line.innerHTML = '<span class="t"></span>  '; line.querySelector('.t').textContent = ts(entry.t); line.append(hexStr(entry.bytes)); }
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 30;
  box.appendChild(line);
  while(box.children.length > 300) box.firstChild.remove();
  if(atBottom) box.scrollTop = box.scrollHeight;
}

function addMark(text){
  text = text.trim(); if(!text) return;
  pushLog({t:new Date(), mark:text});
  toast('Marcado: ' + text);
}

function logText(){
  return log.map(e => e.mark ? `${ts(e.t)}  --- ${e.mark} ---` : `${ts(e.t)}  ${hexStr(e.bytes)}`).join('\n');
}

async function copyLog(){
  const text = logText();
  if(!text){ toast('Registro vazio'); return; }
  try { await navigator.clipboard.writeText(text); toast('Registro copiado'); }
  catch {
    const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); toast('Registro copiado'); }catch{ toast('Não deu pra copiar'); }
    ta.remove();
  }
}

function updateButtons(live){
  $('baseBtn').disabled = !live;
  $('connectBtn').textContent = (device && device.gatt.connected) ? 'Desconectar' : 'Conectar';
  $('simBtn').textContent = simTimer ? 'Parar teste' : 'Testar sem scooter';
}

async function connect(){
  if(device && device.gatt.connected){ device.gatt.disconnect(); return; }
  if(!navigator.bluetooth){
    notice('Este navegador não tem Bluetooth pra páginas web. No iPhone, abra esta página no app Bluefy. No Android ou computador, use o Chrome.');
    return;
  }
  notice('');
  const errText = e => (e && (e.message || e.name)) || String(e);
  const optional = [SVC_UUID, BAT_UUID];
  const attempts = [
    { filters:[{namePrefix:'G2'}], optionalServices: optional },
    { acceptAllDevices:true, optionalServices: optional },
  ];
  let lastErr = null;
  device = null;
  for(const opts of attempts){
    try{ device = await navigator.bluetooth.requestDevice(opts); break; }
    catch(e){
      lastErr = e;
      if(e && e.name==='NotFoundError' && /cancel/i.test(e.message||'')) return;
    }
  }
  if(!device){
    notice('Não consegui abrir a lista de Bluetooth. Erro: ' + errText(lastErr) + '. Confira em Ajustes do iPhone > Bluefy se o Bluetooth está permitido.');
    return;
  }
  stopSim();
  device.addEventListener('gattserverdisconnected', ()=>{ setStatus('Desconectada'); updateButtons(false); toast('Scooter desconectada'); });
  try{
    setStatus('Conectando…');
    const server = await device.gatt.connect();
    const ch = await (await server.getPrimaryService(SVC_UUID)).getCharacteristic(NOTIFY_UUID);
    ch.addEventListener('characteristicvaluechanged', e=>{
      const v = e.target.value; onPacket(new Uint8Array(v.buffer, v.byteOffset, v.byteLength).slice());
    });
    await ch.startNotifications();
    setStatus('Conectada', 'on'); updateButtons(true);
    try{
      const bat = await (await server.getPrimaryService(BAT_UUID)).getCharacteristic(BATLVL_UUID);
      const show = v => { $('battery').hidden=false; $('battery').textContent = 'Bateria pelo serviço padrão: ' + v + ' %'; };
      show((await bat.readValue()).getUint8(0));
      bat.addEventListener('characteristicvaluechanged', e=>show(e.target.value.getUint8(0)));
      await bat.startNotifications();
    }catch{}
  }catch(e){
    setStatus('Desconectada'); updateButtons(false);
    notice('Falha ao conectar: ' + ((e && (e.message||e.name)) || String(e)) + '. Feche o nRF Connect (a scooter só aceita uma conexão) e tente de novo.');
  }
}

// Simulação baseada nos pacotes reais capturados
function startSim(){
  let tick = 0, volt = 4729, mode = 0x0F;
  setStatus('Simulação', 'sim'); updateButtons(true);
  simTimer = setInterval(()=>{
    tick++;
    if(tick % 15 === 0) volt--;
    if(tick % 40 === 0) mode = mode === 0x0F ? 0x14 : 0x0F;
    if(tick % 2){
      onPacket(Uint8Array.from([0xF2,0xB0,0x11,mode,0x50,0,0,0xE3,volt>>8,volt&255,0x0C,0,0x19,0,0,0,0,0x40,0,(tick*7)&255]));
    } else {
      const v = volt - 9;
      onPacket(Uint8Array.from([0x27,0x22,0x82,0x17,v&255,v>>8,0,0,0,0,0,0,0,0,0xEC,0x1B,0x19,0,0x40,tick&255]));
    }
  }, 500);
  updateButtons(true);
}
function stopSim(){ if(simTimer){ clearInterval(simTimer); simTimer=null; setStatus('Desconectada'); updateButtons(false); } }

$('connectBtn').onclick = connect;
$('simBtn').onclick = () => simTimer ? stopSim() : startSim();
$('baseBtn').onclick = () => {
  baseline = new Map(); types.forEach(t => t.cur && baseline.set(t.key, t.cur.slice()));
  $('clearBaseBtn').hidden = false; addMark('referência fixada'); types.forEach(t=>t.cur && renderCard(t,new Date()));
};
$('clearBaseBtn').onclick = () => { baseline=null; $('clearBaseBtn').hidden=true; types.forEach(t=>t.cur && renderCard(t,new Date())); };
$('markForm').onsubmit = e => { e.preventDefault(); addMark($('markInput').value); $('markInput').value=''; };
$('chips').onclick = e => { if(e.target.tagName==='BUTTON') addMark(e.target.textContent); };
$('copyBtn').onclick = copyLog;
$('clearBtn').onclick = () => { log=[]; $('logbox').innerHTML=''; toast('Registro limpo'); };

if(!navigator.bluetooth) notice('Este navegador não tem Bluetooth pra páginas web. No iPhone, abra esta página no app Bluefy. Dá pra ver como funciona em Testar sem scooter.');
</script>
</body>
</html>
